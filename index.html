<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach">
<meta name="theme-color" content="#0b0d10">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>Coach Perso – séances sur mesure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d10;--card:#151920;--card2:#1d222b;--line:#272e39;--txt:#eef1f5;--mut:#8d96a5;--acc:#c8f560;--acc-ink:#121a00;--acc2:#5ee0c7;--warn:#ff9466;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45}
body{padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 84px)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
h1,h2,h3,.disp{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.3px;margin:0}
h1{font-size:34px;font-weight:800;text-transform:uppercase;line-height:1}
h2{font-size:22px;font-weight:700;text-transform:uppercase}
h3{font-size:18px;font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 0 14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--acc);display:grid;place-items:center;color:var(--acc-ink);font-family:"Barlow Condensed";font-weight:800;font-size:20px}
.mut{color:var(--mut)} .sm{font-size:13px} .xs{font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px}
.lbl{display:block;font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{margin-bottom:14px}
input,select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px;font:inherit;font-size:16px;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
.unit{position:relative}.unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:13px;pointer-events:none}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--mut);padding:10px 6px;border-radius:9px;font:inherit;font-weight:600;font-size:14px}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.goal{background:var(--card2);border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:left;color:var(--txt);font:inherit}
.goal b{display:block;font-size:15px;margin:4px 0 2px}.goal small{color:var(--mut);font-size:12px;line-height:1.3;display:block}
.goal.on{border-color:var(--acc);background:#1b2312}
.goal .ic{font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card2);color:var(--txt);border-radius:999px;padding:9px 13px;font:inherit;font-size:14px;font-weight:500}
.chip.on{border-color:var(--acc);background:#1b2312;color:var(--acc)}
.step{display:flex;align-items:center;gap:12px}
.step button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:22px}
.step .v{font-family:"Barlow Condensed";font-size:30px;font-weight:700;min-width:28px;text-align:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;font-size:16px;background:var(--acc);color:var(--acc-ink)}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.sm{padding:10px 14px;font-size:14px;width:auto}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card2);border-radius:12px;padding:12px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:600}
.stat .v{font-family:"Barlow Condensed";font-size:28px;font-weight:700;line-height:1.1}
.stat .v small{font-family:Inter;font-size:13px;color:var(--mut);font-weight:500}
.stat .s{font-size:12px;color:var(--mut)}
.stat.hi{background:#1b2312;border:1px solid #3a4f17}.stat.hi .v{color:var(--acc)}
.macros{display:flex;height:8px;border-radius:6px;overflow:hidden;margin:10px 0 6px}
.macros i{display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.legend b{color:var(--txt)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.week .d{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;width:100%;text-align:left;color:var(--txt);font:inherit}
.week .d.today{border-color:var(--acc)}
.week .d .dn{width:44px;text-align:center;flex:none}
.week .d .dn b{display:block;font-family:"Barlow Condensed";font-size:20px;text-transform:uppercase}
.week .d .dn small{color:var(--mut);font-size:11px}
.week .d .ic{width:42px;height:42px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:20px;flex:none}
.week .d .tx{flex:1;min-width:0}
.week .d .tx b{display:block;font-size:15px}
.week .d .tx small{color:var(--mut);font-size:12.5px}
.week .d.rest{opacity:.7;background:transparent}
.week .d .ok{color:var(--acc);font-weight:700}
.dayrow{display:flex;gap:6px;margin-bottom:14px}
.dayrow button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:10px;padding:8px 0;font:inherit;font-weight:600;font-size:13px;position:relative}
.dayrow button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.dayrow button.has::after{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--acc)}
.dayrow button.on.has::after{background:var(--acc-ink)}
.hero{background:linear-gradient(135deg,#1b2312,#151920 60%);border:1px solid #2f3f17;border-radius:var(--r);padding:18px;margin-bottom:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;background:var(--acc);color:var(--acc-ink);padding:4px 8px;border-radius:6px}
.tag.alt{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.meta{display:flex;gap:16px;margin-top:12px;font-size:13px;color:var(--mut)}
.meta b{color:var(--txt)}
.prog{height:6px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.blk h3{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.blk .note{font-size:13px;color:var(--mut);margin-bottom:8px}
.ex{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:transparent;padding:0}
.ck svg{opacity:0}
.ex.done .ck{background:var(--acc);border-color:var(--acc)}
.ex.done .ck svg{opacity:1}
.ex.done .exn{text-decoration:line-through;color:var(--mut)}
.ex .exb{flex:1;min-width:0}
.exn{font-weight:600}
.exd{font-size:13px;color:var(--acc2)}
.rest-b{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:10px;padding:7px 9px;font:inherit;font-size:12.5px;font-weight:600;white-space:nowrap}
.timers{display:flex;gap:8px;flex-wrap:wrap}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(11,13,16,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);z-index:20}
.tabs button{flex:1;border:0;background:transparent;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font:inherit;font-size:11px;font-weight:600}
.tabs button.on{color:var(--acc)}
.tabs svg{width:24px;height:24px}
.ov{position:fixed;inset:0;background:rgba(5,6,8,.96);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.ov.show{display:flex}
.ring{position:relative;width:250px;height:250px}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:"Barlow Condensed";font-size:84px;font-weight:800}
.ov .lab{color:var(--mut);margin:18px 0 22px;text-align:center;font-weight:600}
.ov .ctr{display:flex;gap:10px}
.ov.end .num{color:var(--acc)}
.banner{display:flex;gap:12px;align-items:flex-start;background:#13202a;border:1px solid #23404d;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:13.5px}
.banner b{color:var(--acc2)}
.banner .x{margin-left:auto;background:none;border:0;color:var(--mut);font-size:20px;line-height:1;padding:0 2px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translateX(-50%) translateY(20px);background:var(--acc);color:var(--acc-ink);padding:12px 18px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hist{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.hist:first-child{border-top:0}
.del{background:none;border:0;color:var(--mut);font-size:18px;padding:0 4px}
.disc{font-size:11.5px;color:var(--mut);text-align:center;margin:18px 8px 6px;line-height:1.4}
.pace{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.pace div{background:var(--card2);border-radius:10px;padding:8px 6px;text-align:center}
.pace b{display:block;font-family:"Barlow Condensed";font-size:19px}
.pace small{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.play{width:36px;height:36px;border-radius:50%;border:0;background:var(--acc);color:var(--acc-ink);font-size:13px;flex:none;display:grid;place-items:center;padding:0 0 0 2px}
.runb{margin-left:auto;border:1px solid #3a4f17;background:#1b2312;color:var(--acc);border-radius:10px;padding:6px 10px;font:inherit;font-family:Inter;font-size:12.5px;font-weight:700;white-space:nowrap}
.sbar{position:sticky;top:calc(env(safe-area-inset-top) + 4px);z-index:10;display:flex;align-items:center;gap:10px;background:rgba(21,25,32,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:8px 10px 8px 14px;margin-bottom:14px}
.sbar b{font-family:"Barlow Condensed";font-size:28px;line-height:1}
.sbar .bt{margin-left:auto;display:flex;gap:6px}
.live{width:10px;height:10px;border-radius:50%;background:#ff5a5a;animation:pl 1.2s infinite;flex:none}
.live.off{background:var(--mut);animation:none}
@keyframes pl{50%{opacity:.25}}
#arc{stroke:var(--acc);transition:stroke-dashoffset .2s linear}
.ov.rest #arc{stroke:var(--acc2)}
.ov.man #arc{stroke-opacity:.35}
.ovtop{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:16px;right:16px;display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px}
.ovtop #ovtitle{font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovtop #ovsess{margin-left:auto;white-space:nowrap}
.ovtop .x{background:var(--card2);border:1px solid var(--line);color:var(--txt);width:36px;height:36px;border-radius:50%;font-size:15px;flex:none}
.ovstep{color:var(--acc);font-weight:700;letter-spacing:.6px;text-transform:uppercase;font-size:13px;margin-bottom:16px;text-align:center;min-height:18px}
.ov.rest .ovstep{color:var(--acc2)}
.ovname{font-family:"Barlow Condensed";font-size:32px;font-weight:800;text-transform:uppercase;text-align:center;margin-top:20px;line-height:1.05;max-width:360px}
.ovsub{color:var(--acc2);font-size:14px;text-align:center;margin-top:6px;max-width:340px;min-height:20px}
.ov.rest .ovsub{color:var(--mut)}
.ovnext{color:var(--mut);font-size:13px;margin:14px 0 22px;text-align:center}
.ovnext b{color:var(--txt)}
.ring .num.long{font-size:60px}
.cbtn{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--txt);font:inherit;font-weight:700;font-size:16px}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}
.empty .big{font-size:42px;margin-bottom:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><div class="logo">C</div><div><div class="disp" style="font-size:22px;font-weight:800;text-transform:uppercase;line-height:1">Coach Perso</div><div class="xs mut">Séances sur mesure</div></div></div>
    <div id="topinfo" class="xs mut" style="text-align:right"></div>
  </div>
  <main id="view"></main>
</div>

<nav class="tabs">
  <button data-a="tab" data-v="profil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profil</button>

  <button data-a="tab" data-v="seance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>Séance</button>
  <button data-a="tab" data-v="suivi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 17l5-5 4 4 8-8"/><path d="M14 8h6v6"/></svg>Suivi</button>
</nav>

<div class="ov" id="ov">
  <div class="ovtop"><span id="ovtitle"></span><span id="ovsess"></span><button class="x" data-a="rclose" aria-label="Fermer">✕</button></div>

    <button class="cbtn" data-a="radd" id="radd">+15</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ DONNÉES ============ */
const DAYS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const DPAT={2:[0,3],3:[0,2,4],4:[0,1,3,4],5:[0,1,2,4,5],6:[0,1,2,3,4,5]};
const LV={deb:0,inter:1,av:2};
const GOALS={
  perte:{nom:"Perte de poids",ic:"🔥",desc:"Brûler du gras, circuits, cardio",kcal:-0.20,prot:2.0,series:3,reps:"12-15",repos:45,circuit:true,finisher:true,
    note:"Déficit calorique d'environ 20 %. Enchaîne vite, garde un rythme élevé. Vise 8 000 pas par jour en plus des séances."},
  masse:{nom:"Prise de masse",ic:"💪",desc:"Gagner du muscle et du poids",kcal:0.12,prot:2.0,series:4,reps:"8-12",repos:90,

    note:"Léger déficit (~10 %) et protéines élevées pour garder le muscle. Les charges restent lourdes, le finisher brûle le surplus."},
  force:{nom:"Force",ic:"🏋️",desc:"Soulever plus lourd",kcal:0.05,prot:1.8,series:5,reps:"4-6",repos:150,

  forme:{nom:"Remise en forme",ic:"🌱",desc:"Bouger, se sentir mieux",kcal:0,prot:1.6,series:3,reps:"10-12",repos:60,

};
const SPORTS={
  militaire:{nom:"Calisthénie militaire",ic:"🎖️",t:"mili",rate:9},

  velo:{nom:"Vélo / Spinning",ic:"🚴",t:"velo",rate:9},
  natation:{nom:"Natation",ic:"🏊",t:"natation",rate:9},
  boxe:{nom:"Boxe",ic:"🥊",t:"boxe",rate:10},

  marche:{nom:"Marche rapide",ic:"🚶",t:"marche",rate:5},

};
const SPLITS={
  fb:["quad","pousserH","tirerH","hanche","pousserV","tirerV","gainage","unilat"],
  fb2:["unilat","pousserH","tirerV","hanche","triceps","tirerH","gainage","quad"],
  haut:["pousserH","tirerH","pousserV","tirerV","triceps","biceps","gainage"],
  bas:["quad","hanche","unilat","mollets","gainage","hanche"],
  push:["pousserH","pousserV","pousserH","triceps","pousserV","triceps"],

  legs:["quad","hanche","unilat","mollets","quad","gainage"]

const SPLITN={fb:"Full body",haut:"Haut du corps",bas:"Bas du corps",push:"Push · pecs, épaules, triceps",pull:"Pull · dos, biceps",legs:"Jambes & fessiers"};
const GAIN=[["Planche","Dead bug","Planche latérale"],["Planche","Mountain climbers","Hollow hold","Planche latérale avec rotation"],["Planche un bras levé","Hollow rocks","L-sit au sol","Dragon flag négatif"]];
const DB={
 poids:{
  quad:[["Squat au poids du corps","Assis-debout sur chaise"],["Squat sauté","Squat tempo 3-1-1"],["Pistol squat assisté","Squat bulgare sauté","Shrimp squat"]],
  hanche:[["Pont fessier","Good morning poids du corps"],["Pont fessier une jambe","Hip thrust pieds sur canapé"],["Hip thrust une jambe pieds surélevés","Nordic curl (descente lente)"]],

  else if(t==="boxe")o=bBoxe(k,c,p,L,r);else if(t==="mili")o=bMili(k,c,p,L,r);else if(t==="prepa")o=bPrepa(k,c,p,L,r);else if(t==="marche")o=bMarche(k,c,p,L,r);else o=bMobi(k,c,p,L,r);
  o.sport=s;o.dur=o.dur||p.duree;o.lvl=L;o.kcal=Math.round(SPORTS[s].rate*[0.85,1,1.15][L]*o.dur*p.poids/75/5)*5;return o;

const dayLvl=d=>{const v=S.lv&&S.lv[S.seed+"|"+d];return v==null?lvl():v};
const LVN=["Débutant","Intermédiaire","Avancé"];
function planWeek(){
  const p=S.p,days=DPAT[p.jours],sp=p.sports.length?p.sports:["poids"];
  const seq=days.map((d,i)=>sp[i%sp.length]),cnt={},occ={},w=Array(7).fill(null);
  seq.forEach(s=>cnt[s]=(cnt[s]||0)+1);
  days.forEach((d,i)=>{const s=seq[i],k=occ[s]||0;occ[s]=k+1;w[d]=build(s,k,cnt[s],p,dayLvl(d),rng(S.seed*7919+d*131+k*17))});
  return w;
}
function calc(){
  const p=S.p,h=p.taille/100,imc=p.poids/(h*h);
  const cat=imc<18.5?"Insuffisance pondérale":imc<25?"Corpulence normale":imc<30?"Surpoids":"Obésité";
  const bmr=10*p.poids+6.25*p.taille-5*p.age+(p.sexe==="h"?5:-161);
  const f={sed:1.2,leg:1.375,mod:1.5,act:1.65}[p.activite];
  let train=0;planWeek().forEach(s=>{if(s)train+=s.kcal});
  const tdee=bmr*f+train/7,G=GOALS[p.objectif];
  let cible=Math.round(tdee*(1+G.kcal)/10)*10;cible=Math.max(cible,p.sexe==="h"?1500:1200);
  const pw=imc>=30?27*h*h:p.poids,prot=Math.round(G.prot*pw),lip=Math.round(cible*0.27/9),glu=Math.max(0,Math.round((cible-prot*4-lip*9)/4));
  return{imc,cat,bmr:Math.round(bmr),tdee:Math.round(tdee/10)*10,cible,prot,lip,glu,fc:fcmax(),train:Math.round(train)};
}

function timersCard(){return `<div class="card"><span class="lbl">Minuteur rapide</span><div class="timers">${[30,45,60,90,120,180].map(v=>`<button class="rest-b" data-a="timer" data-v="${v}">${v<60?v+" s":(v/60).toString().replace(".",",")+" min"}</button>`).join("")}</div></div>`}
function isThisWeek(iso){const n=new Date(),m=new Date(n);m.setHours(0,0,0,0);m.setDate(m.getDate()-((n.getDay()+6)%7));return new Date(iso)>=m}
function vSuivi(){

/* ============ CHRONOS ============ */
function fmtT(sec,sw){sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),x=sec%60;
  if(h)return h+":"+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0");if(!sw&&sec<60)return String(x);return m+":"+String(x).padStart(2,"0")}
function sElapsed(){const r=S.run;if(!r)return 0;return((r.p||Date.now())-r.t0-r.pt)/1000}
function sStart(){if(!S.run)S.run={t0:Date.now(),p:null,pt:0};else if(S.run.p){S.run.pt+=Date.now()-S.run.p;S.run.p=null}save()}
function sPause(){if(S.run&&!S.run.p){S.run.p=Date.now();save()}}
setInterval(()=>{const c=$("#sclock");if(c)c.textContent=fmtT(sElapsed(),1);const o=$("#ovsess");if(o)o.textContent=S.run?"⏱ "+fmtT(sElapsed(),1):"";
  if(S.run)$("#topinfo").innerHTML=(S.run.p?"⏸ ":"🔴 ")+"Séance<br><b style='color:var(--txt);font-size:14px'>"+fmtT(sElapsed(),1)+"</b>"},500);

function setDone(key,on){if(on)S.done[key]=1;else delete S.done[key];save();
  const ex=document.querySelector('.ex[data-k="'+key+'"]');if(!ex)return;ex.classList.toggle("done",on);
  const all=document.querySelectorAll(".ex").length,dn=document.querySelectorAll(".ex.done").length;
  if($("#cnt"))$("#cnt").textContent=dn+"/"+all;if($("#bar"))$("#bar").style.width=(dn*100/all)+"%";if(on&&dn===all)toast("Tout est fait, bravo ! 💪")}

/* --- traduit un exercice en étapes chronométrées --- */
function pDur(t){if(!t)return 0;let m=t.match(/^(\d+)\s*min(?:\s*(\d+))?/);if(m)return +m[1]*60+(+m[2]||0);m=t.match(/^(\d+)(?:-(\d+))?\s*s(?![\wÀ-ÿ])/);if(m)return +(m[2]||m[1]);return 0}
const cap=t=>t?t.charAt(0).toUpperCase()+t.slice(1):t;
function phasesFor(it,key){
  const n=it.n,d=it.d||"",ph=[];let m;
  const W=(lab,sec,step,sub)=>ph.push({k:"w",lab:cap(lab),sec:sec||null,step:step||"",sub:sub===undefined?d:sub});
  const Rs=(sec,lab)=>{if(sec>0)ph.push({k:"r",lab:lab||"Repos",sec,sub:""})};
  if((m=d.match(/^(\d+) × \((\d+) s effort \/ (\d+) s repos\)/))){const N=+m[1],nm=(n.split(": ")[1]||n).split(" / ");
    for(let i=0;i<N;i++){W(nm[i%nm.length],+m[2],"Round "+(i+1)+"/"+N,"À fond !");if(i<N-1)Rs(+m[3])}Rs(it.repos)}
  else if((m=n.match(/^Tabata (\d+) min\s*:?\s*(.*)/))){const nm=m[2]||"À fond";for(let i=0;i<8;i++){W(nm,20,"Round "+(i+1)+"/8","À fond !");if(i<7)Rs(10)}}
  else if((m=n.match(/^EMOM (\d+) min\s*:\s*(.+)/))){const N=+m[1];for(let i=0;i<N;i++)W(m[2],60,"Minute "+(i+1)+"/"+N,"Fais tes reps, le reste de la minute = repos")}
  else if((m=n.match(/Pyramide ([\d-]+) min/))){const L=m[1].split("-").map(Number);L.forEach((x,i)=>{W("Effort "+x+" min",x*60,"Palier "+(i+1)+"/"+L.length);if(i<L.length-1)Rs(x*60,"Récup "+x+" min")})}
  else if((m=n.match(/^(\d+) × \((.+?) \+ (.+?)\)/))){const N=+m[1],a=pDur(m[2]),b=pDur(m[3]),la=m[2].replace(/^\d+ min( \d+)?\s*/,""),lb=m[3].replace(/^\d+ min( \d+)?\s*/,"");
    for(let i=0;i<N;i++){W(la,a,"Bloc "+(i+1)+"/"+N);ph.push({k:"r",lab:cap(lb),sec:b,sub:""})}}
  else if((m=n.match(/^(\d+) × (\d+)\/(\d+)/))){iv(+m[1],+m[2],+m[3],"Vite")}
  else if((m=(n.includes(":")?n.split(":").slice(1).join(":"):n).match(/(\d+) (s|min)[^/]*\/\s*(\d+) (s|min)/)||d.match(/(\d+) (s|min)[^/]*\/\s*(\d+) (s|min)/))){
    const a=+m[1]*(m[2]==="min"?60:1),b=+m[3]*(m[4]==="min"?60:1);let N=1,mm;
    if((mm=n.match(/^(\d+) ×/)))N=+mm[1];else if((mm=n.match(/^(\d+) min/)))N=Math.max(1,Math.floor(+mm[1]*60/(a+b)));
    const lab=n.includes(":")?n.split(":")[1].split("/")[0].replace(/\d+ (s|min)\s*/,"").trim():n.replace(/^\d+ × /,"").split("/")[0].replace(/\d+ s\s*/,"").trim();
    iv(N,a,b,lab||"Effort")}
  else if((m=n.match(/^(\d+) × (\d+)(?:-(\d+))? ?(s|min)\b/)||d.match(/^(\d+) × (\d+)(?:-(\d+))? ?(s|min)\b/))){
    const N=+m[1],sec=+(m[3]||m[2])*(m[4]==="min"?60:1),lab=/^\d+ ×/.test(n)?n.replace(/^\d+ × /,""):n;
    for(let i=0;i<N;i++){W(lab,sec,"Série "+(i+1)+"/"+N);if(i<N-1)Rs(it.repos||30)}}
  else if((m=n.match(/ (\d+) × (\d+) ?(s|min)(?![\wÀ-ÿ])/))){const N=+m[1],sec=+m[2]*(m[3]==="min"?60:1);for(let i=0;i<N;i++){W(n,sec,"Série "+(i+1)+"/"+N);if(i<N-1)Rs(it.repos||60)}}
  else if((m=n.match(/ (\d+) × \d+/))){const N=+m[1];for(let i=0;i<N;i++){W(n,null,"Série "+(i+1)+"/"+N);if(i<N-1)Rs(it.repos||90)}}
  else if((m=n.match(/^(\d+) × /)||d.match(/^(\d+) × /))){const N=+m[1],lab=n.replace(/^\d+ × /,"");
    for(let i=0;i<N;i++){W(lab,null,"Série "+(i+1)+"/"+N);if(i<N-1)Rs(it.repos||0)}}
  else{let sec=/^\d+ tours/.test(n)?0:(pDur(n)||pDur(d));if(!sec){const x=d.match(/· (\d+) min$/)||n.match(/(\d+) min$/);if(x)sec=+x[1]*60}
    W(n,sec,"");if(sec&&it.repos)Rs(it.repos)}
  function iv(N,a,b,lab){const t10=/tous les 10/.test(n+d);
    for(let i=0;i<N;i++){W(lab,a,N>1?"Rép "+(i+1)+"/"+N:"");
      if(t10&&(i+1)%10===0&&i<N-1)Rs(180,"Repos long");else if(i<N-1||N===1)Rs(b,"Récup")}}
  if(key){for(let i=ph.length-1;i>=0;i--)if(ph[i].k==="w"){ph[i].key=key;break}}
  return ph;
}
function blockPhases(b,bi){
  const K=ii=>sig()+"|"+S.day+"|"+bi+"|"+ii,keys=b.items.map((x,ii)=>K(ii)),list=b.items.map(x=>x.n).join(" · ");
  if(b.run){const r=b.run;
    if(r.type==="cd")return[{k:"w",lab:r.lab,sec:r.sec,step:"Max de tours",sub:list,keys}];
    if(r.type==="sw")return[{k:"w",lab:r.lab,sec:null,step:"Limite "+r.cap+" min",sub:list,keys}];
    const ph=[];for(let i=0;i<r.min;i++){const it=b.items[i%b.items.length];ph.push({k:"w",lab:it.n.replace(/^Min \d+ : /,""),sec:60,step:"Minute "+(i+1)+"/"+r.min,sub:"Le reste de la minute = repos",keys:i===r.min-1?keys:null})}return ph}
  const tours=b.tourRest?+((b.t.match(/(\d+) tours/)||[0,1])[1]):1,ph=[];
  for(let t=0;t<tours;t++){b.items.forEach((it,ii)=>{const p=phasesFor(it,t===tours-1?K(ii):null);
      if(tours>1)p.forEach(x=>x.step="Tour "+(t+1)+"/"+tours+(x.step?" · "+x.step:""));ph.push(...p);
      const last=p[p.length-1];if(ii<b.items.length-1&&last&&last.k==="w"){if(b.tourRest)ph.push({k:"r",lab:"Transition",sec:15,sub:"Prochain : "+b.items[ii+1].n});else if(it.repos)ph.push({k:"r",lab:"Repos",sec:it.repos,sub:"Prochain : "+b.items[ii+1].n})}});
    if(b.tourRest&&t<tours-1)ph.push({k:"r",lab:"Repos entre les tours",sec:b.tourRest,sub:"Tour "+(t+2)+" ensuite"})}
  return ph;
}

/* --- lecteur --- */
let AC=null,WL=null;const R={ph:[],i:0,t0:0,end:0,pz:null,iv:null,bp:{}};
function audio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(e){}}
function beep(n){try{if(!AC)return;for(let i=0;i<n;i++){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=n>1?(i===n-1?1320:880):660;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+i*0.22;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.45,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);o.start(t);o.stop(t+0.2)}}catch(e){}}
async function lock(){try{if(navigator.wakeLock)WL=await navigator.wakeLock.request("screen")}catch(e){}}
function run(title,ph,autoStart){if(!ph||!ph.length)return;audio();if(autoStart!==false&&(!S.run||S.run.p)){sStart();if(S.tab==="seance")render()}
  R.title=title;R.ph=ph;$("#ov").classList.add("show");$("#ov").classList.remove("end");lock();go(0)}
function go(i){R.i=i;const p=R.ph[i];R.t0=Date.now();R.end=p.sec?R.t0+p.sec*1000:0;R.pz=null;R.bp={};paint();clearInterval(R.iv);R.iv=setInterval(tk,200);tk();if(i>0&&p.k==="w")beep(1)}
function paint(){const ov=$("#ov"),p=R.ph[R.i],nx=R.ph[R.i+1];ov.classList.toggle("rest",p.k==="r");ov.classList.toggle("man",!p.sec);
  $("#ovtitle").textContent=R.title;$("#ovstep").textContent=[p.step,R.ph.length>1?"Étape "+(R.i+1)+"/"+R.ph.length:""].filter(Boolean).join("  ·  ");
  $("#ovname").textContent=p.lab;$("#ovsub").textContent=p.sub||(p.sec?"":"Appuie sur « Fait » quand c'est fini");
  $("#ovnext").innerHTML=nx?"Ensuite : <b>"+nx.lab+"</b>"+(nx.sec?" · "+fmtT(nx.sec,nx.sec>=60):""):"Dernière étape 💪";
  $("#rn").textContent=p.sec?"Passer ⏭":"Fait ✓";$("#radd").style.visibility=p.sec?"visible":"hidden";$("#rpz").textContent="⏸"}
function tk(){if(R.pz||!R.ph.length)return;const p=R.ph[R.i],now=Date.now(),num=$("#tnum");let txt;
  if(p.sec){const ms=Math.max(0,R.end-now),left=Math.ceil(ms/1000);txt=fmtT(left);$("#arc").setAttribute("stroke-dashoffset",703.7*(1-ms/(p.sec*1000)));
    if(left<=3&&left>0&&!R.bp[left]){R.bp[left]=1;beep(1)}if(ms<=0){beep(3);nxt();return}}
  else{txt=fmtT((now-R.t0)/1000,1);$("#arc").setAttribute("stroke-dashoffset",0)}
  num.textContent=txt;num.classList.toggle("long",txt.length>5)}
function nxt(){const p=R.ph[R.i];if(!p)return;if(p.cb)p.cb(Math.floor(((R.pz||Date.now())-R.t0)/1000));if(p.key)setDone(p.key,true);if(p.keys)p.keys.forEach(k=>k&&setDone(k,true));if(R.i+1<R.ph.length)go(R.i+1);else endRun()}
function togglePause(){if(R.pz){const dt=Date.now()-R.pz;R.t0+=dt;R.end+=dt;R.pz=null;$("#rpz").textContent="⏸";tk()}else{R.pz=Date.now();$("#rpz").textContent="▶"}}
function endRun(){clearInterval(R.iv);const ov=$("#ov");ov.classList.add("end");ov.classList.remove("rest","man");$("#tnum").textContent="✓";$("#arc").setAttribute("stroke-dashoffset",0);
  $("#ovname").textContent="Terminé, bravo !";$("#ovsub").textContent="";$("#ovnext").textContent="";$("#ovstep").textContent="";R.ph=[];setTimeout(()=>{if(!R.ph.length)closeRun()},1500)}
function closeRun(){clearInterval(R.iv);R.ph=[];$("#ov").classList.remove("show","end","rest","man");try{WL&&WL.release()}catch(e){}WL=null}

/* ============ ÉVÉNEMENTS ============ */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  if(a==="tab"){S.tab=v;save();render();scrollTo(0,0);return}
  if(a==="set"){S.p[b.dataset.f]=v;save();render();return}
  if(a==="sport"){const L=S.p.sports,i=L.indexOf(v);if(i>=0){if(L.length>1)L.splice(i,1);else toast("Garde au moins un sport")}else L.push(v);save();render();return}
  if(a==="jours"){S.p.jours=clamp(S.p.jours+(+v),2,6);save();render();return}
  if(a==="regen"){S.seed++;save();render();toast("Nouvelles séances générées");return}
  if(a==="day"){S.day=+v;S.tab="seance";save();render();scrollTo(0,0);return}
  if(a==="slvl"){const d=S.day,pre=sig()+"|"+d+"|";Object.keys(S.done).forEach(k=>{if(k.startsWith(pre))delete S.done[k]});S.lv[S.seed+"|"+d]=+v;save();render();toast("Séance passée en "+LVN[+v]);return}
  if(a==="selday"){S.day=+v;save();render();return}
  if(a==="hidebanner"){S.banner=false;save();render();return}
  if(a==="chk"){setDone(v,!S.done[v]);return}
  if(a==="timer"){run("Repos",[{k:"r",lab:"Repos",sec:+v,sub:"Respire, bois une gorgée"}],false);return}
  if(a==="play"){const s=planWeek()[S.day],bi=+b.dataset.b,ii=+b.dataset.i,it=s.blocs[bi].items[ii];run(it.n,phasesFor(it,sig()+"|"+S.day+"|"+bi+"|"+ii));return}
  if(a==="runblk"){const s=planWeek()[S.day],bi=+b.dataset.b;run(s.blocs[bi].t,blockPhases(s.blocs[bi],bi));return}
  if(a==="rnext"){if(R.pz)togglePause();nxt();return}
  if(a==="rprev"){go(Math.max(0,R.i-1));return}
  if(a==="rpause"){togglePause();return}
  if(a==="radd"){const p=R.ph[R.i];if(p&&p.sec){R.end+=15000;p.sec+=15;tk()}return}
  if(a==="rclose"){closeRun();return}
  if(a==="ttest"){const t=TESTS.find(x=>x[0]===v);const fill=n=>{const el=$("#t_"+v);if(el&&!el.value)el.value=n};
    if(t[3])run("Test · "+t[1],[{k:"w",lab:"Max de "+t[1].toLowerCase(),sec:t[3],step:"Test militaire",sub:v==="pompes"?"Poitrine près du sol, bras tendus en haut. Compte tes reps !":"Mains aux tempes, coudes aux genoux. Compte tes reps !"}],false);
    else run("Test · "+t[1],[{k:"w",lab:t[1]+" max",sec:null,step:"Test militaire",sub:v==="gainage"?"Appuie sur « Fait » quand tu lâches : le temps est noté tout seul":"Bras tendus en bas, menton au-dessus de la barre",cb:v==="gainage"?fill:null}],false);return}
  if(a==="tsave"){const e={};let any=false;TESTS.forEach(([k])=>{const x=parseInt($("#t_"+k).value);if(x>=0){e[k]=x;any=true}});if(!any){toast("Entre au moins un score");return}
    const d=new Date();e.date=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");S.tests=S.tests.filter(t=>t.date!==e.date);S.tests.push(e);save();render();toast("Test enregistré 🎖️");return}
  if(a==="sstart"){sStart();render();toast("Chrono lancé ⏱");return}
  if(a==="spause"){if(S.run&&S.run.p)sStart();else sPause();render();return}
  if(a==="sreset"){if(b.dataset.c){S.run=null;save();render()}else{b.dataset.c="1";b.textContent="Remettre à 0 ?";setTimeout(()=>{if(b.isConnected){delete b.dataset.c;b.textContent="↺"}},3000)}return}
  if(a==="fin"){const s=planWeek()[S.day];if(!s)return;const real=S.run?Math.max(1,Math.round(sElapsed()/60)):0;S.run=null;closeRun();S.hist.push({date:new Date().toISOString(),titre:s.titre,sport:s.sport,kcal:s.kcal,day:S.day,sig:sig(),real});save();toast(real?"Séance enregistrée · "+real+" min ✓":"Séance enregistrée ✓");S.tab="suivi";render();scrollTo(0,0);return}
  if(a==="addp"){const x=parseFloat(($("#np").value||"").replace(",","."));if(!(x>25&&x<350)){toast("Entre un poids valide");return}
    const d=new Date(),iso=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    S.poids=S.poids.filter(p=>p.date!==iso);S.poids.push({date:iso,v:x});S.p.poids=x;save();render();toast("Poids enregistré");return}
  if(a==="delp"){S.poids=S.poids.filter(p=>p.date!==v);save();render();return}
  if(a==="reset"){if(b.dataset.c){S.hist=[];S.poids=[];S.done={};S.tests=[];save();render();toast("Historique effacé")}else{b.dataset.c="1";b.textContent="Appuie encore pour confirmer";setTimeout(()=>{if(b.isConnected){delete b.dataset.c;b.textContent="Effacer l'historique"}},3000)}return}
});
document.addEventListener("input",e=>{
  const f=e.target.dataset.f;if(!f)return;let val=e.target.value;
  if(["age","taille","poids","duree"].includes(f)){val=parseFloat(String(val).replace(",","."));if(!(val>0))return;
    const lim={age:[12,95],taille:[120,230],poids:[30,300],duree:[15,120]}[f];if(val<lim[0]||val>lim[1])return}
  S.p[f]=val;save();const st=$("#stats");if(st)st.innerHTML=vStats();
  $("#topinfo").innerHTML=`${GOALS[S.p.objectif].ic} ${GOALS[S.p.objectif].nom}<br>${S.p.poids} kg`;
});
render();
</script>
</body>
